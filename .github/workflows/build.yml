name: Build Plugins

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew ExampleProvider:make

      - name: Upload CS3
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-plugin
          path: "**/build/*.cs3"
